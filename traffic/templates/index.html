<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>서울 실시간 도로 소통</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root {
    --bg: #f4f5f7;
    --panel: #ffffff;
    --ink: #1c1f24;
    --muted: #6b7280;
    --line: #e5e7eb;
    --accent: #1c1f24;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: Pretendard, -apple-system, "Malgun Gothic", sans-serif;
    background: var(--bg);
    color: var(--ink);
    display: flex;
    flex-direction: column;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    padding: 14px 20px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; align-items: center; gap: 14px; }
  .brand .logo { height: 40px; width: auto; display: block; }
  header h1 { font-size: 18px; font-weight: 700; margin: 0; letter-spacing: -0.02em; }
  header .updated { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .legend { display: flex; gap: 14px; font-size: 13px; color: var(--muted); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }

  main { flex: 1; display: flex; min-height: 0; }
  /* 서울 밖: 채도를 낮춘 숲 느낌의 세이지 그린 */
  :root { --outside: #a9bca4; }
  #map { flex: 1; min-height: 0; background: var(--outside); }
  /* 가림막 그림자가 서울 경계 안쪽으로 살짝 드리워 입체감을 줌 */
  #map .leaflet-mask-pane { filter: drop-shadow(0 0 8px rgba(30, 60, 30, 0.3)); }
  /* 배경지도는 컬러를 유지하되 채도를 살짝 낮춰 정체도 색이 먼저 눈에 들어오게 */
  #map .leaflet-tile-pane { filter: saturate(0.8); }
  /* 화면 전환 시 순간적으로 다시 그려지는 모습을 가리는 짧은 페이드 */
  #map .leaflet-map-pane { transition: opacity 0.16s ease; }
  #map.switching .leaflet-map-pane { opacity: 0; }
  .leaflet-container .leaflet-control-attribution { background: rgba(255, 255, 255, 0.75); }
  aside {
    width: 360px;
    flex: none;
    background: var(--panel);
    border-left: 1px solid var(--line);
    overflow-y: auto;
    padding: 20px;
  }
  @media (max-width: 760px) {
    main { flex-direction: column; }
    #map { flex: none; height: 58vh; }
    aside { width: auto; border-left: 0; border-top: 1px solid var(--line); padding: 16px; }
  }

  h2 { font-size: 22px; margin: 0 0 4px; letter-spacing: -0.02em; display: flex; align-items: center; gap: 10px; }
  .sub { font-size: 13px; color: var(--muted); margin: 0 0 18px; }
  .badge { font-size: 12px; font-weight: 600; color: #fff; padding: 3px 9px; border-radius: 999px; }
  .back {
    border: 1px solid var(--line); background: var(--panel); color: var(--ink);
    font: inherit; font-size: 13px; padding: 6px 12px; border-radius: 8px; cursor: pointer; margin-bottom: 16px;
  }
  .back:hover { background: var(--bg); }

  .bar { display: flex; height: 10px; border-radius: 999px; overflow: hidden; background: var(--line); margin: 6px 0 8px; }
  .bar div { height: 100%; }
  .bar-legend { display: flex; gap: 12px; font-size: 12px; color: var(--muted); margin-bottom: 20px; flex-wrap: wrap; }
  .bar-legend span { display: inline-flex; align-items: center; gap: 5px; }

  .section-title { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; margin: 0 0 8px; }
  .gu-list { list-style: none; margin: 0; padding: 0; }
  .gu-list li {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 8px; border-radius: 8px; cursor: pointer; font-size: 14px;
  }
  .gu-list li:hover { background: var(--bg); }
  .gu-list .name { flex: 1; font-weight: 500; }
  .gu-list .meta { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }

  .card { border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-top: 4px; }
  .card h3 { font-size: 16px; margin: 0 0 4px; line-height: 1.4; }
  .card .route { font-size: 13px; color: var(--muted); margin: 0 0 14px; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .stat .k { font-size: 12px; color: var(--muted); }
  .stat .v { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .stat .v small { font-size: 12px; font-weight: 500; color: var(--muted); margin-left: 2px; }
  .note { font-size: 12px; color: var(--muted); margin-top: 14px; line-height: 1.5; }
  .hint { font-size: 13px; color: var(--muted); padding: 14px; border: 1px dashed var(--line); border-radius: 12px; text-align: center; }

  .gu-label span {
    display: inline-block;
    transform: translate(-50%, -50%);
    white-space: nowrap;
    font-size: 13px;
    font-weight: 700;
    color: #1c1f24;
    letter-spacing: -0.02em;
    text-shadow: 0 0 3px #fff, 0 0 3px #fff, 0 0 6px #fff;
  }
  .leaflet-tooltip.gu-tip { font-family: inherit; font-size: 13px; padding: 6px 10px; }
</style>
</head>
<body>
<header>
  <div class="brand">
    <!-- 로고 파일이 없으면 자동으로 숨김 (assets/kw_logo.png) -->
    <img class="logo" src="kw_logo.png" alt="광운대학교" onerror="this.remove()">
    <div>
      <h1>서울 실시간 도로 소통</h1>
      <div class="updated" id="updated"></div>
    </div>
  </div>
  <div class="legend" id="legend"></div>
</header>
<main>
  <div id="map"></div>
  <aside id="panel"></aside>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="data.js?v={{VERSION}}"></script>
<script>
(function () {
  const DATA = window.TRAFFIC_DATA;
  const LV = DATA.levels;
  const ORDER = ["SMOOTH", "SLOW", "JAM"];
  const panel = document.getElementById("panel");

  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const badge = (lv) => `<span class="badge" style="background:${LV[lv].color};color:${LV[lv].text}">${LV[lv].label}</span>`;
  const fmtSpeed = (v) => (v == null ? "-" : Math.round(v));

  document.getElementById("updated").textContent = `${DATA.updated_at} 기준 · 5분마다 갱신`;
  document.getElementById("legend").innerHTML = ORDER.concat("UNKNOWN")
    .map((k) => `<span><i class="dot" style="background:${LV[k].color}"></i>${LV[k].label}</span>`).join("");

  // ---- 지도 ----------------------------------------------------------
  // 구와 도로를 같은 캔버스에 그려야 클릭 판정이 서로 가리지 않는다
  // tolerance: 얇은 도로도 클릭하기 쉽게 / padding: 화면 바깥까지 미리 그려서 이동 중 빈 곳이 안 보이게
  const canvas = L.canvas({ tolerance: 6, padding: 0.5 });
  // zoomSnap을 작게 하면 확대 단계가 촘촘해져서 서울이 화면에 꽉 차게 맞춰진다
  const map = L.map("map", { renderer: canvas, zoomControl: true, zoomSnap: 0.1, zoomDelta: 0.5 });
  map.attributionControl.setPrefix(false);

  const districtByName = {};
  DATA.districts.forEach((d) => (districtByName[d.name] = d));

  let current = null;          // 선택한 구 이름 (null이면 서울 전체)
  let roadLayer = null;
  let selectedRoad = null;

  const districtStyle = (feature) => {
    const d = districtByName[feature.properties.name];
    const active = current === d.name;
    return {
      color: active ? "#1c1f24" : "#ffffff",
      weight: active ? 2.5 : 1.5,
      // 상세 화면: 선택한 구는 투명(배경지도가 보이게), 나머지 구는 옅게
      fillColor: LV[d.level].color,
      fillOpacity: current ? (active ? 0 : 0.25) : 0.55,
    };
  };

  const districtLayer = L.geoJSON({
    type: "FeatureCollection",
    features: DATA.districts.map((d) => ({ type: "Feature", properties: { name: d.name }, geometry: d.geometry })),
  }, {
    style: districtStyle,
    onEachFeature: (feature, layer) => {
      const d = districtByName[feature.properties.name];
      layer.bindTooltip(
        `<b>${esc(d.name)}</b> · ${LV[d.level].label}` + (d.avg_speed != null ? ` · 평균 ${fmtSpeed(d.avg_speed)}km/h` : ""),
        { sticky: true, className: "gu-tip" });
      layer.on("click", (e) => {
        L.DomEvent.stopPropagation(e);              // 지도 바깥 클릭 처리로 넘어가지 않게
        if (current !== d.name) showDistrict(d.name);
      });
      layer.on("mouseover", () => { if (!current) layer.setStyle({ fillOpacity: 0.9 }); });
      layer.on("mouseout", () => districtLayer.resetStyle(layer));
    },
  }).addTo(map);

  const seoulBounds = districtLayer.getBounds();

  // ---- 배경지도: 서울 근처 타일만 불러온다 --------------------------------
  const tiles = L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
    bounds: seoulBounds.pad(0.05),
    maxZoom: 19,
    keepBuffer: 4,          // 화면 주변 타일을 넉넉히 남겨둬 다시 불러오는 깜빡임을 줄임
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> · 교통·도로: 서울 열린데이터광장 · 구 경계: 통계청',
  }).addTo(map);

  // ---- 서울 밖 가리기 -------------------------------------------------
  // 전 세계를 덮는 사각형에 25개 구 모양으로 구멍을 뚫어 서울만 보이게 한다.
  // padding을 크게 줘서(화면의 1.5배 바깥까지 미리 그림) 이동·확대 중에도 바깥이 비치지 않게 함
  map.createPane("mask");
  map.getPane("mask").style.zIndex = 350;          // 배경지도(200) 위, 구·도로(400) 아래
  map.getPane("mask").style.pointerEvents = "none";
  const maskRenderer = L.svg({ pane: "mask", padding: 1.5 });
  const holes = [];
  DATA.districts.forEach((d) => {
    const polys = d.geometry.type === "Polygon" ? [d.geometry.coordinates] : d.geometry.coordinates;
    polys.forEach((p) => holes.push(p[0].map(([x, y]) => [y, x])));
  });
  L.polygon([[[-85, -180], [-85, 180], [85, 180], [85, -180]], ...holes], {
    renderer: maskRenderer, stroke: false, fillColor: "#a9bca4", fillOpacity: 0.95, interactive: false,
  }).addTo(map);

  map.fitBounds(seoulBounds, { padding: [8, 8] });
  // 서울 밖으로 멀리 끌고 가거나 너무 축소하지 못하게 제한
  map.setMaxBounds(seoulBounds.pad(0.2));
  map.setMinZoom(map.getZoom());

  // 서울 밖(빈 영역)을 누르면 처음 화면으로
  map.on("click", () => { if (current) showOverview(); });

  // ---- 구 이름 표시 (서울 전체 화면에서만) ------------------------------
  const labelLayer = L.layerGroup(DATA.districts.map((d) =>
    L.marker(d.label, {
      interactive: false, keyboard: false,
      icon: L.divIcon({ className: "gu-label", html: `<span>${esc(d.name)}</span>`, iconSize: null }),
    })));

  // ---- 공통 패널 조각 -------------------------------------------------
  function levelBar(counts) {
    const total = ORDER.reduce((s, k) => s + (counts[k] || 0), 0);
    if (!total) return `<p class="sub">수집된 속도 정보가 없습니다.</p>`;
    const seg = ORDER.map((k) => `<div style="width:${(100 * (counts[k] || 0)) / total}%;background:${LV[k].color}"></div>`).join("");
    const leg = ORDER.map((k) => `<span><i class="dot" style="background:${LV[k].color}"></i>${LV[k].label} ${Math.round((100 * (counts[k] || 0)) / total)}%</span>`).join("");
    return `<div class="bar">${seg}</div><div class="bar-legend">${leg}</div>`;
  }

  // ---- 서울 전체 화면 -------------------------------------------------
  // ---- 화면 전환: 살짝 어둡게 → 바꾸기 → 배경지도 준비되면 다시 밝게 -----------
  // 즉시 전환하면 지도가 다시 그려지는 순간이 번쩍여 보이므로 짧은 페이드로 가린다
  const mapEl = document.getElementById("map");
  let switching = false;
  function transition(change) {
    if (switching) return;
    switching = true;
    mapEl.classList.add("switching");
    setTimeout(() => {
      change();
      let shown = false;
      const show = () => {
        if (shown) return;
        shown = true;
        mapEl.classList.remove("switching");
        switching = false;
      };
      if (tiles.isLoading()) tiles.once("load", show);
      else requestAnimationFrame(show);
      setTimeout(show, 700);                      // 타일이 늦게 와도 0.7초 뒤엔 보여줌
    }, 160);
  }
  const showOverview = () => transition(drawOverview);
  const showDistrict = (name) => transition(() => drawDistrict(name));

  function drawOverview() {
    current = null;
    selectedRoad = null;
    if (roadLayer) { map.removeLayer(roadLayer); roadLayer = null; }
    districtLayer.setStyle(districtStyle);
    labelLayer.addTo(map);
    map.fitBounds(seoulBounds, { padding: [8, 8], animate: false });

    const cityCounts = {};
    DATA.districts.forEach((d) => ORDER.forEach((k) => (cityCounts[k] = (cityCounts[k] || 0) + (d.counts[k] || 0))));

    const sorted = [...DATA.districts].sort((a, b) => (b.score ?? -1) - (a.score ?? -1));
    panel.innerHTML = `
      <h2>서울 전체</h2>
      <p class="sub">구를 누르면 도로별 상세 지도를 볼 수 있어요.</p>
      <p class="section-title">도로 구간 상태</p>
      ${levelBar(cityCounts)}
      <p class="section-title">구별 소통 (막히는 순)</p>
      <ul class="gu-list">
        ${sorted.map((d) => `
          <li data-gu="${esc(d.name)}">
            <i class="dot" style="background:${LV[d.level].color}"></i>
            <span class="name">${esc(d.name)}</span>
            <span class="meta">${d.avg_speed != null ? fmtSpeed(d.avg_speed) + "km/h" : "-"}</span>
          </li>`).join("")}
      </ul>`;
    panel.querySelectorAll(".gu-list li").forEach((li) =>
      li.addEventListener("click", () => showDistrict(li.dataset.gu)));
  }

  // ---- 구 상세 화면 ---------------------------------------------------
  function roadStyle(l, selected) {
    const base = l.expressway ? 6 : 4;
    return {
      color: LV[l.level].color,
      weight: selected ? base + 4 : base,
      opacity: l.level === "UNKNOWN" ? 0.6 : 0.95,
      lineCap: "butt",      // 둥근 끝은 선 두께만큼 구 경계 밖으로 삐져나와 보여서 평평하게
      lineJoin: "round",
    };
  }

  function drawDistrict(name) {
    const d = districtByName[name];
    current = name;
    selectedRoad = null;
    districtLayer.setStyle(districtStyle);
    map.removeLayer(labelLayer);
    if (roadLayer) map.removeLayer(roadLayer);

    districtLayer.eachLayer((layer) => {
      if (layer.feature.properties.name !== name) return;
      layer.bringToFront();      // 옆 구의 흰 테두리가 선택한 구의 테두리를 덮지 않게 (도로보다 먼저 해야 도로가 위에 그려짐)
      map.fitBounds(layer.getBounds(), { padding: [20, 20], animate: false });
    });

    // 구 경계 안쪽으로 잘라둔 도로 조각만 그린다
    roadLayer = L.layerGroup().addTo(map);
    d.roads.forEach(([idx, pieces]) => {
      const l = DATA.links[idx];
      const latlngs = pieces.map((piece) => piece.map(([x, y]) => [y, x]));
      const line = L.polyline(latlngs, roadStyle(l, false)).addTo(roadLayer);
      line.on("click", (e) => {
        L.DomEvent.stopPropagation(e);
        selectRoad(l, line);
      });
    });

    renderDistrictPanel(d, null);
  }

  function selectRoad(l, line) {
    if (selectedRoad) selectedRoad.line.setStyle(roadStyle(selectedRoad.link, false));
    selectedRoad = { link: l, line };
    line.setStyle(roadStyle(l, true));
    line.bringToFront();
    renderDistrictPanel(districtByName[current], l);
  }

  function roadCard(l) {
    const mins = l.travel_time != null ? Math.floor(l.travel_time / 60) : null;
    const secs = l.travel_time != null ? l.travel_time % 60 : null;
    return `
      <div class="card">
        <h3>${esc(l.road_name || "링크 " + l.id)} ${badge(l.level)}</h3>
        <p class="route">${l.from && l.to ? `${esc(l.from)} → ${esc(l.to)}` : "&nbsp;"}</p>
        <div class="stats">
          <div class="stat"><div class="k">현재 속도</div><div class="v">${fmtSpeed(l.speed)}<small>km/h</small></div></div>
          <div class="stat"><div class="k">통행 시간</div><div class="v">${mins == null ? "-" : mins}<small>분</small>${secs == null ? "" : secs + "<small>초</small>"}</div></div>
          <div class="stat"><div class="k">구간 길이</div><div class="v">${(l.length_m / 1000).toFixed(2)}<small>km</small></div></div>
          <div class="stat"><div class="k">도로 종류</div><div class="v" style="font-size:16px">${esc(l.type)}</div></div>
        </div>
        <p class="note">${esc(l.type)} 기준: ${l.jam_max}km/h 이하 정체 · ${l.jam_max}~${l.slow_max}km/h 서행 · ${l.slow_max}km/h 이상 원활 (서울시 TOPIS)<br>링크 ID ${esc(l.id)}</p>
      </div>`;
  }

  function renderDistrictPanel(d, road) {
    panel.innerHTML = `
      <button class="back" id="back">← 서울 전체</button>
      <h2>${esc(d.name)} ${badge(d.level)}</h2>
      <p class="sub">평균 ${d.avg_speed != null ? fmtSpeed(d.avg_speed) + "km/h" : "-"} · 도로 ${d.roads.length}개 구간</p>
      <p class="section-title">도로 구간 상태</p>
      ${levelBar(d.counts)}
      <p class="section-title">선택한 도로</p>
      ${road ? roadCard(road) : `<div class="hint">지도에서 도로를 눌러보세요</div>`}`;
    document.getElementById("back").addEventListener("click", showOverview);
  }

  drawOverview();      // 첫 화면은 페이드 없이 바로
})();
</script>
</body>
</html>
