name: 사이트 자동 갱신

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 패키지 설치
        run: pip install requests python-dotenv

      - name: 속도 수집 + 사이트 생성
        env:
          SEOUL_API_KEY: ${{ secrets.SEOUL_API_KEY }}
        run: python update_site.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/site

      - id: deploy
        uses: actions/deploy-pages@v4
